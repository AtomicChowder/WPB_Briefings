<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WPB Intelligence Briefing — Friday, 9 October 2026 — Adam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --hsbc-red: #DB0011;
      --hsbc-red-dark: #a80009;
      --navy: #1a1f36;
      --navy-dark: #0f1424;
      --navy-mid: #252b47;
      --surface: #f4f5f7;
      --card: #ffffff;
      --border: #e5e7eb;
      --text: #1f2937;
      --text-mid: #6b7280;
      --text-light: #9ca3af;
      --chart-bg: #0a0f1e;
      --chart-grid: #1e2a3a;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--surface); color: var(--text); line-height: 1.6; }
    a { color: var(--hsbc-red); text-decoration: none; }
    a:hover { text-decoration: underline; }
    strong { font-weight: 600; }

    /* ── Header ── */
    .site-header {
      background: var(--navy);
      border-top: 4px solid var(--hsbc-red);
      padding: 20px 32px;
    }
    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }
    .header-brand { display: flex; align-items: center; gap: 14px; }
    /* Brand mark: a 4px HSBC-red keyline, not a pseudo-logo. To use the official
       HSBC logo, add the approved SVG from the design kit as docs/assets/hsbc-logo.svg
       and swap this block for an <img>. Never hand-draw the trademark. */
    .hsbc-keyline {
      width: 4px; height: 40px; background: var(--hsbc-red);
      flex-shrink: 0;
    }
    .brand-text h1 { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
    .brand-text p { font-size: 12px; color: #8a93b2; margin-top: 1px; }
    .header-meta { text-align: right; }
    .header-meta .date { font-size: 14px; font-weight: 600; color: #fff; }
    .header-meta .user-info { font-size: 12px; color: #8a93b2; margin-top: 3px; }
    .header-meta .user-name { color: #c9d0e8; font-weight: 500; }

    /* ── Shared layout ── */
    .section-wrap { max-width: 1280px; margin: 0 auto; padding: 0 32px; }
    section { padding: 40px 0; }
    .section-label {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
      color: var(--hsbc-red); margin-bottom: 10px;
    }
    .section-label::before {
      content: ''; display: block; width: 16px; height: 2px; background: var(--hsbc-red);
    }
    .section-title { font-size: 22px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
    .section-sub { font-size: 13px; color: var(--text-mid); margin-bottom: 28px; }

    /* ── Talking Points ── */
    .talking-points-section { background: var(--surface); }
    .tp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    @media (max-width: 900px) { .tp-grid { grid-template-columns: 1fr; } }
    .tp-card {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 24px;
      display: flex; gap: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      position: relative;
      overflow: hidden;
    }
    .tp-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 3px; background: var(--hsbc-red);
    }
    .tp-card.is-update::before { background: #d97706; }
    .tp-num {
      flex-shrink: 0;
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--hsbc-red);
      color: white; font-weight: 700; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .tp-card.is-update .tp-num { background: #d97706; }
    .tp-body { flex: 1; min-width: 0; }
    .tp-update-badge {
      display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
      background: #fef3c7; color: #92400e; border-radius: 4px; padding: 2px 7px;
      margin-bottom: 8px; text-transform: uppercase;
    }
    .tp-headline { font-size: 15px; font-weight: 600; color: var(--navy); margin-bottom: 10px; line-height: 1.4; }
    .tp-context { font-size: 13px; color: var(--text-mid); line-height: 1.65; margin-bottom: 14px; }
    .tp-context strong { color: var(--text); }
    .tp-sources { display: flex; flex-wrap: wrap; gap: 6px; }
    .tp-source-link {
      font-size: 11px; font-weight: 500;
      color: var(--hsbc-red); background: #fff0f1; border: 1px solid #fbc4c8;
      border-radius: 4px; padding: 3px 8px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;
    }
    .tp-source-link:hover { background: #ffe0e3; text-decoration: none; }

    /* ── Chart section ── */
    .chart-section { background: var(--chart-bg); padding: 48px 0; }
    .chart-section .section-label { color: #e05565; }
    .chart-section .section-label::before { background: #e05565; }
    .chart-section .section-title { color: #e2e8f0; }
    .chart-section .section-sub { color: #64748b; }
    .chart-layout { display: grid; grid-template-columns: 1fr 180px; gap: 24px; align-items: start; }
    @media (max-width: 900px) { .chart-layout { grid-template-columns: 1fr; } }
    #bubble-chart-container svg { display: block; width: 100%; }
    .chart-legend { padding-top: 40px; }
    .legend-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 0; cursor: pointer;
      font-size: 12px; color: #94a3b8;
      border-bottom: 1px solid #1e2a3a;
      transition: color 0.15s;
    }
    .legend-item:hover { color: #e2e8f0; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .chart-note {
      margin-top: 14px; font-size: 11px; color: #475569; line-height: 1.6;
    }
    .chart-tooltip {
      position: fixed; display: none;
      background: #1e293b; color: #f1f5f9;
      padding: 12px 16px; border-radius: 10px;
      font-size: 13px; max-width: 300px;
      pointer-events: none; z-index: 9999;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      border: 1px solid #334155; line-height: 1.5;
    }

    /* ── Feed section ── */
    .section-WRONGPLACEHOLDER
